# Optional: publish container images to GitHub Container Registry on version tags.
name: Images
on: {push: {tags: ["v*"]}}
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: "ghcr.io/${{ github.repository_owner }}/vigil:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/vigil:latest"}
      - uses: docker/build-push-action@v6
        with: {context: ., file: deploy/demo-app/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/vigil-demo-app:latest"}
